[build-system]
requires = ["setuptools>=61.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true


[project]
name = "locutus"
authors = [
    {name = "Eric Torstenson", email="eric.s.torstenson@vumc.org"}
]
description = "Research terminology management system."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dynamic = ["version"]
keywords = ["Vocabulary", "Research Data", "Borg"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = ["marshmallow",
                "cachelib",
                "flask",
                "flask-cors",
                "flask-restful",
                "flask-session",
                "nanoid",
                "PyYAML",
                "rich",
                "search-dragon@git+https://github.com/NIH-NCPI/search-dragon.git",
                "firebase-admin",
                "pymongo"
                ]
[dependency-groups]
    dev = [
    "pytest",
    "pytest-order>=1.5.0",
    "pytest-cov",
]

[project.optional-dependencies]
dev = [
    "rich",
    "pytest",
    "pytest-env",
    "pytest-order>=1.5.0",
    "pytest-cov",
    "ruff",
    "basedpyright"
]
test = [
    "pytest",
    "pytest-env",
    "pytest-order>=1.5.0"
]
cloud = [
    "python-json-logger", # Only installed when explicitly requested
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export symbols as public API surface
"__init__.py" = ["F401"]
# Test modules import fixtures across files for pytest to discover/inject them
"src/locutus/tests/*.py" = ["F401", "F811"]

[tool.basedpyright]
# "standard" (the default) treats missing/incomplete type annotations as
# errors, which floods an untyped codebase with noise unrelated to actual
# bugs. "basic" keeps the substantive checks (attribute access, None
# handling, argument/call type mismatches) while we incrementally add
# annotations. Revisit once real findings are near zero.
typeCheckingMode = "basic"

[tool.setuptools_scm]
version_file = "src/locutus/_version.py"


[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)


#[project.scripts]
#asdf = "locutus.module:function"

[tool.pytest.ini_options]
testpaths = ["src/locutus/tests"]
# addopts = "-x"
markers = [
    "first: run this test before others"
]

[tool.pytest_env]
MONGO_URIs = { value = "mongodb://localhost:27017/test", skip_if_set = false }
